name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its older runs, on main every commit gets checked
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      # Artifacts of another compiler version are useless, so the version is part of the cache key
      - id: rustc
        run: echo "version=$(rustc -V)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ steps.rustc.outputs.version }}-
      - run: cargo clippy --locked -- -D warnings
