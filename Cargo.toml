[package]
name = "akkutray"
version = "0.1.0"
edition = "2024"
description = "Battery levels of wireless devices as CLI and Windows tray icon"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
raw-window-handle = "0.6"
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-manifest = "1.5"
